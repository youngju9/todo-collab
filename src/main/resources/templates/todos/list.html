<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>할 일 목록</title>
</head>
<body>
    <h1>할 일 목록</h1>

    <a href="/todos/new">+ 새 할 일 등록</a>

    <p th:if="${#lists.isEmpty(todos)}">등록된 할 일이 없습니다.</p>

    <table th:unless="${#lists.isEmpty(todos)}" border="1">
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>마감일</th>
                <th>상태</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.id}">1</td>
                <td>
                    <a th:href="@{/todos/{id}(id=${todo.id})}"
                       th:text="${todo.title}">제목</a>
                </td>
                <td th:text="${todo.dueDate}">2026-11-30</td>
                <td th:text="${todo.completed} ? '완료' : '진행 중'">진행 중</td>
                <td>
                    <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                        <button type="submit" onclick="return confirm('정말 삭제할까요?')">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
