<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>할 일 수정</title>
</head>
<body>
    <h1>할 일 수정</h1>

    <form th:action="@{/todos/{id}/edit(id=${todoId})}"
          th:object="${todoUpdateRequest}" method="post">
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}">
            <p th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}"></p>
        </div>

        <div>
            <label for="content">내용</label>
            <textarea id="content" th:field="*{content}"></textarea>
        </div>

        <div>
            <label for="dueDate">마감일</label>
            <input type="date" id="dueDate" th:field="*{dueDate}">
            <p th:if="${#fields.hasErrors('dueDate')}"
               th:errors="*{dueDate}"></p>
        </div>

        <button type="submit">수정하기</button>
        <a th:href="@{/todos/{id}(id=${todoId})}">취소</a>
    </form>
</body>
</html>
